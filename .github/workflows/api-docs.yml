# Builds the aggregated Javadoc for one release tag and stores it on the api-docs branch under
# api/<version>/, with api/latest/ a copy of the newest release. The Docs workflow copies that
# branch into the published site, so https://jwcarman.github.io/codec/api/ carries every release.
name: API docs

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the API docs for (e.g. 0.7.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: api-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # The tag names a directory and a git ref below; accept only a plain semantic version.
      - name: Validate the tag
        run: |
          case "$RELEASE_TAG" in
            *[!0-9.]*|"") echo "not a release version: '$RELEASE_TAG'"; exit 1 ;;
          esac
          echo "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release version: '$RELEASE_TAG'"; exit 1; }

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          path: source

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven

      - name: Build the aggregated Javadoc
        working-directory: source
        run: |
          mvn -B -q versions:set -DnewVersion="$RELEASE_TAG" -DprocessAllModules=true
          EXCLUDE=""
          if [ -d codec-benchmarks ]; then EXCLUDE="-pl !codec-benchmarks"; fi
          mvn -B -DskipTests $EXCLUDE compile javadoc:aggregate
          APIDOCS=$(find . -type d -name apidocs -path '*/target/*' | head -1)
          test -n "$APIDOCS" || { echo "no apidocs directory produced"; exit 1; }
          echo "APIDOCS=$PWD/$APIDOCS" >> "$GITHUB_ENV"

      - name: Check out the api-docs branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" api-docs >/dev/null; then
            git clone --depth 1 --branch api-docs "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" api-docs
          else
            git init -b api-docs api-docs
          fi

      - name: Store the release under api/<version> and refresh api/latest
        working-directory: api-docs
        run: |
          rm -rf "api/$RELEASE_TAG" api/latest
          mkdir -p api
          cp -r "$APIDOCS" "api/$RELEASE_TAG"
          LATEST=$(ls api | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          cp -r "api/$LATEST" api/latest
          python3 - <<'PYEOF'
          import os
          import re

          versions = sorted(
              (v for v in os.listdir("api") if re.fullmatch(r"\d+\.\d+\.\d+", v)),
              key=lambda v: tuple(int(p) for p in v.split(".")),
              reverse=True,
          )
          rows = "\n".join(
              f'    <li><a href="{v}/">{v}</a>{" (latest)" if i == 0 else ""}</li>'
              for i, v in enumerate(versions)
          )
          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Codec API documentation</title>
          <style>
          body {{ font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #222; }}
          h1 {{ font-size: 1.6rem; }}
          li {{ margin: 0.25rem 0; }}
          </style>
          </head>
          <body>
          <h1>Codec API documentation</h1>
          <p>Aggregated Javadoc for every published module, one set per release.
          The <a href="latest/">latest</a> release is {versions[0]}.</p>
          <ul>
          {rows}
          </ul>
          <p><a href="../">Back to the guides</a></p>
          </body>
          </html>
          """
          with open("api/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF

      - name: Commit and push the api-docs branch
        working-directory: api-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "API docs for $RELEASE_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:api-docs
