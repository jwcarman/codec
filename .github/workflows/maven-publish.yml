name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Maven Central Repository
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # processAllModules is required: codec-bom is deliberately parentless, and versions:set walks
      # parent references, so without it the BOM keeps its -SNAPSHOT version and publishes that way.
      # Maven Central artifacts are immutable, so this cannot be corrected after the fact.
      # The tag name is passed through env rather than interpolated into the run: script, so that a
      # tag containing shell metacharacters cannot inject commands.
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mvn versions:set -DnewVersion="$RELEASE_TAG" -DprocessAllModules=true

      - name: Publish package
        run: mvn -P release --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
