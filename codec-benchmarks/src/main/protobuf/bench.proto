syntax = "proto3";

package codec.benchmarks;

option java_package = "org.jwcarman.codec.benchmarks";
option java_outer_classname = "BenchProtos";

message PersonProto {
  string name = 1;
  int32 age = 2;
  bool active = 3;
  string email = 4;
}
