site_name: Codec
site_description: Type-safe serialization abstraction for Java.
site_url: https://jwcarman.github.io/codec/
repo_url: https://github.com/jwcarman/codec
repo_name: jwcarman/codec
edit_uri: edit/main/docs/

docs_dir: docs

# Process artifacts (specs) and internal working notes stay out of the site.
exclude_docs: |
  /superpowers/
  /native-image-hints.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/jwcarman.css
  - stylesheets/codec.css

extra_javascript:
  - javascripts/hex-tape.js

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Codec Composition: guides/composition.md
      - Jackson Dataformats: guides/dataformats.md
      - Apache Fory: guides/fory.md
      - Encryption: guides/encryption.md
      - Threat Model: guides/threat-model.md
      - Spring Boot: guides/spring-boot.md
      - Spring Data Redis: guides/redis.md
  - Reference:
      - Changelog: https://github.com/jwcarman/codec/blob/main/CHANGELOG.md
